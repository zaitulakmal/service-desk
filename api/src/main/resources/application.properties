spring.application.name=service-desk-api

# Every setting below can be overridden with an environment variable (used in Kubernetes).
# The defaults point at the local stack started with: docker compose up -d

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/servicedesk}
spring.datasource.username=${DB_USERNAME:servicedesk}
spring.datasource.password=${DB_PASSWORD:servicedesk}
# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# db/demo loads the demo company directory and sample tickets. Set FLYWAY_LOCATIONS to drop it.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

# Stop clients from asking for huge pages (e.g. ?size=100000).
spring.data.web.pageable.max-page-size=100

# Security: only accept access tokens issued by our Keycloak realm for this API.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/servicedesk}
# Where to download Keycloak's signing keys. In Kubernetes this is the internal service address.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8180/realms/servicedesk/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=servicedesk-api
servicedesk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
servicedesk.events.topic=servicedesk.ticket-events

# Attachments: RustFS locally (S3-compatible); on AWS, empty endpoint and keys = real S3 with the pod's IAM role.
servicedesk.attachments.bucket=${ATTACHMENTS_BUCKET:servicedesk-attachments}
servicedesk.attachments.endpoint=${S3_ENDPOINT:http://localhost:9000}
servicedesk.attachments.region=${AWS_REGION:ap-southeast-1}
servicedesk.attachments.access-key=${S3_ACCESS_KEY:servicedesk}
servicedesk.attachments.secret-key=${S3_SECRET_KEY:servicedesk-secret}
servicedesk.attachments.create-bucket=${S3_CREATE_BUCKET:true}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Health probes for Kubernetes, metrics for Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Latency histograms so Grafana can show p95/p99 response times.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
