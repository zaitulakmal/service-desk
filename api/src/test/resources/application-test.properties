# Tests start from an empty schema (no demo data) and create exactly what they need.
spring.flyway.locations=classpath:db/migration
# Background jobs are switched off; tests call them directly when they need them.
servicedesk.outbox.relay.enabled=false
servicedesk.sla.breach-check.enabled=false
# Attachments go to an in-memory fake (TestStorageConfiguration); S3AttachmentStorageTests covers real S3.
servicedesk.attachments.create-bucket=false
