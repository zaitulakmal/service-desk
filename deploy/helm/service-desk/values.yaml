# Defaults run the whole system on a laptop cluster (Rancher Desktop / k3s) at
# http://servicedesk.localhost. For a real cluster, see values-aws.yaml: managed
# Postgres, Kafka and S3 replace the in-cluster infrastructure.

hosts:
  app: servicedesk.localhost        # web app and /api
  auth: auth.servicedesk.localhost  # Keycloak
  mail: mail.servicedesk.localhost  # Mailpit inbox (demo only)
scheme: http
ingressClassName: traefik
ingressAnnotations: {}

# HTTPS certificates from cert-manager (e.g. Let's Encrypt). Off for the laptop cluster.
tls:
  enabled: false
  clusterIssuer: letsencrypt

# Browser addresses outside the cluster that serve the web app (e.g. a Vercel deployment).
# They are allowed to call the API (CORS) and to log in through Keycloak.
webOrigins: []
# Link used in emails. Defaults to the in-cluster web app at hosts.app.
webUrl: ""

images:
  api: service-desk/api:0.1.4
  notification: service-desk/notification-service:0.1.4
  web: service-desk/frontend:0.1.4
  pullPolicy: IfNotPresent

api:
  replicas: 2
  # Loads the demo company and sample tickets (db/demo). Turn off for real data.
  demoData: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCpuPercent: 70
    # The JVM uses a lot of CPU while it starts. Wait before reacting so a
    # starting pod does not look like a traffic spike.
    scaleUpStabilizationSeconds: 120
  resources:
    # The CPU request is what "70%" is measured against, so it must be realistic.
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 640Mi }

notification:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 448Mi }

web:
  # Turn off when the web app is hosted outside the cluster (list it under webOrigins).
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

# Managed services, used for each dependency whose in-cluster version is turned off.
external:
  databaseHost: ""          # e.g. RDS endpoint
  # Existing Secret (keys: username, password) with the database admin login. When set,
  # a Job creates each service's database and user before install/upgrade.
  databaseAdminSecret: ""
  kafkaBootstrapServers: "" # e.g. MSK brokers
  s3Endpoint: ""            # empty = AWS S3
  s3Region: ap-southeast-1
  attachmentsBucket: servicedesk-attachments
  oidcIssuer: ""            # defaults to the in-cluster Keycloak at hosts.auth
  smtpHost: ""
  smtpPort: 1025

# Passwords for the in-cluster demo. In production these come from a secret manager.
secrets:
  apiDbPassword: servicedesk
  notificationsDbPassword: notifications
  keycloakDbPassword: keycloak
  keycloakAdminPassword: admin
  s3AccessKey: servicedesk
  s3SecretKey: servicedesk-secret

# In-cluster dependencies. Turn one off to use the managed service under "external".
infrastructure:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 2Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
  kafka:
    enabled: true
    image: apache/kafka:4.3.1
    storage: 2Gi
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 640Mi }
  keycloak:
    enabled: true
    image: quay.io/keycloak/keycloak:26.8.1
    # The servicedesk-dev-cli client allows password logins from scripts. Keep it for
    # local development only.
    devClient: true
    resources:
      requests: { cpu: 100m, memory: 768Mi }
      limits: { memory: 1Gi }
  mailpit:
    enabled: true
    image: axllent/mailpit:v1.31.6
  rustfs:
    enabled: true
    image: rustfs/rustfs:1.0.3
    storage: 2Gi
