{{- if .Values.infrastructure.keycloak.enabled }}
{{- $name := printf "%s-keycloak" (include "sd.name" .) -}}
{{- $kc := .Values.infrastructure.keycloak -}}
# Keycloak with the servicedesk realm (users, roles, clients) imported on first start.
# In a company this is usually the corporate identity provider (e.g. Microsoft Entra ID).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-realm
  labels:
    {{- include "sd.labels" . | nindent 4 }}
data:
  {{- /*
  The realm file lists the laptop addresses. Add this deployment's web addresses to the
  web client's allowed redirects, and drop the script login client outside development.
  */}}
  {{- $realm := .Files.Get "files/servicedesk-realm.json" | fromJson }}
  {{- $origins := splitList "," (include "sd.webOrigins" .) | compact }}
  {{- $clients := list }}
  {{- range $client := $realm.clients }}
  {{- if eq $client.clientId "servicedesk-web" }}
  {{- $redirects := $client.redirectUris }}
  {{- $webOrigins := $client.webOrigins }}
  {{- $logout := index $client.attributes "post.logout.redirect.uris" }}
  {{- range $origin := $origins }}
  {{- $redirects = append $redirects (printf "%s/*" $origin) }}
  {{- $webOrigins = append $webOrigins $origin }}
  {{- $logout = printf "%s##%s/*" $logout $origin }}
  {{- end }}
  {{- $_ := set $client "redirectUris" ($redirects | uniq) }}
  {{- $_ := set $client "webOrigins" ($webOrigins | uniq) }}
  {{- $_ := set $client.attributes "post.logout.redirect.uris" $logout }}
  {{- end }}
  {{- if or $.Values.infrastructure.keycloak.devClient (ne $client.clientId "servicedesk-dev-cli") }}
  {{- $clients = append $clients $client }}
  {{- end }}
  {{- end }}
  {{- $_ := set $realm "clients" $clients }}
  servicedesk-realm.json: |
{{ toPrettyJson $realm | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: keycloak
          image: {{ $kc.image }}
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "sd.name" . }}-secrets, key: keycloak-admin-password } }
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://{{ include "sd.dbHost" . }}:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "sd.name" . }}-secrets, key: keycloak-db-password } }
            # Public address in tokens; pods inside the cluster may still call the internal service.
            - name: KC_HOSTNAME
              value: {{ .Values.scheme }}://{{ .Values.hosts.auth }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms256m -Xmx512m"
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          resources:
            {{- toYaml $kc.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: {{ $name }}-realm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
