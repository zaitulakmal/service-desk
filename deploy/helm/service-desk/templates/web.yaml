{{- $name := printf "%s-web" (include "sd.name" .) -}}
# The web app's runtime settings. Same origin as the API (behind one ingress), so apiUrl is empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "sd.labels" . | nindent 4 }}
data:
  config.js: |
    window.__SERVICEDESK_CONFIG__ = {
      apiUrl: '',
      oidcAuthority: '{{ include "sd.oidcIssuer" . }}',
      oidcClientId: 'servicedesk-web',
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Restart the pods when the settings change.
        checksum/config: {{ include "sd.oidcIssuer" . | sha256sum }}
    spec:
      securityContext:
        {{- include "sd.podSecurity" . | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "sd.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
