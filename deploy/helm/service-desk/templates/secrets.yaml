apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sd.name" . }}-secrets
  labels:
    {{- include "sd.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-db-password: {{ .Values.secrets.apiDbPassword | quote }}
  notifications-db-password: {{ .Values.secrets.notificationsDbPassword | quote }}
  keycloak-db-password: {{ .Values.secrets.keycloakDbPassword | quote }}
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
