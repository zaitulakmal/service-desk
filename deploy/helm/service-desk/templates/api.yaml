{{- $name := printf "%s-api" (include "sd.name" .) -}}
# The API's identity in the cluster. On AWS, EKS Pod Identity links it to an IAM role
# that may read and write the attachments bucket, so no AWS keys are stored anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/name: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- include "sd.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://{{ include "sd.dbHost" . }}:5432/servicedesk
            - name: DB_USERNAME
              value: servicedesk
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "sd.name" . }}-secrets, key: api-db-password } }
            {{- if not .Values.api.demoData }}
            - name: FLYWAY_LOCATIONS
              value: classpath:db/migration
            {{- end }}
            # Tokens carry the public Keycloak address; signing keys are fetched over the internal network.
            - name: OIDC_ISSUER_URI
              value: {{ include "sd.oidcIssuer" . }}
            - name: OIDC_JWK_SET_URI
              value: {{ include "sd.jwkSetUri" . }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.scheme }}://{{ .Values.hosts.app }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "sd.kafka" . }}
            - name: ATTACHMENTS_BUCKET
              value: {{ .Values.external.attachmentsBucket }}
            - name: S3_ENDPOINT
              value: {{ include "sd.s3Endpoint" . | quote }}
            - name: AWS_REGION
              value: {{ .Values.external.s3Region }}
            {{- if .Values.infrastructure.rustfs.enabled }}
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "sd.name" . }}-secrets, key: s3-access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "sd.name" . }}-secrets, key: s3-secret-key } }
            - name: S3_CREATE_BUCKET
              value: "true"
            {{- else }}
            # On AWS: no keys; the pod's IAM role (IRSA) grants access to the bucket.
            - name: S3_ACCESS_KEY
              value: ""
            - name: S3_CREATE_BUCKET
              value: "false"
            {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "sd.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
# Adds API pods when average CPU passes the target, and removes them when it drops.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.api.autoscaling.scaleUpStabilizationSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCpuPercent }}
---
# Keeps at least one API pod running during node maintenance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
