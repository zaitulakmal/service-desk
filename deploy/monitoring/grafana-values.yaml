# Grafana with Prometheus already connected and the Service Desk dashboard loaded.
# Install with:
#   helm upgrade --install grafana grafana-community/grafana -n monitoring \
#     -f deploy/monitoring/grafana-values.yaml \
#     --set-file dashboards.default.service-desk.json=deploy/monitoring/service-desk-dashboard.json

adminUser: admin
adminPassword: admin   # local demo only

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.servicedesk.localhost

# Anyone can view dashboards without logging in (demo). Editing still needs admin.
grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Viewer
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/default/service-desk.json

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        folder: Service Desk
        type: file
        options:
          path: /var/lib/grafana/dashboards/default

# Grafana 13 is heavier than older versions: it was OOM-killed at 256 MB and timed out
# requests at 512 MB (busy garbage collecting). 1 GB keeps it responsive.
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { memory: 1Gi }
