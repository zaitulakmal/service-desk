spring.application.name=notification-service
server.port=${PORT:8081}

# Every setting can be overridden with an environment variable (used in Kubernetes).
# The defaults point at the local stack started with: docker compose up -d

# Its own database: services never share tables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/notifications}
spring.datasource.username=${DB_USERNAME:notifications}
spring.datasource.password=${DB_PASSWORD:notifications}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka: every replica joins the same group, so each event is handled by exactly one of them.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
notifications.topic=servicedesk.ticket-events

# Email. Locally this is Mailpit, which catches everything: http://localhost:8025
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
notifications.from=Service Desk <servicedesk@example.com>
notifications.web-url=${WEB_URL:http://localhost:5173}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Latency histograms so Grafana can show p95/p99 response times.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
