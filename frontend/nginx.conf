# Built assets have content hashes in their names, so they can be cached forever.
# Everything else (index.html, config.js) must be checked on every visit.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths (e.g. /tickets/42) load index.html and React routes them.
    location / {
        try_files $uri /index.html;
    }
}
